url: https://bmaitner.github.io/transformerpalettes/

template:
  bootstrap: 5
  bslib:
    primary: "#C8262E"

home:
  title: transformerpalettes - Transformers palettes for R
  links:
    - text: Browse the palettes
      href: articles/browse.html
    - text: Request a character
      href: https://github.com/bmaitner/transformerpalettes/issues/new?template=new-character.yml
    - text: Suggest a palette change
      href: https://github.com/bmaitner/transformerpalettes/issues/new/choose

navbar:
  structure:
    left: [browse, reference, news]
    right: [search, github]
  components:
    browse:
      text: Browse palettes
      href: articles/browse.html

articles:
  - title: Palette browser
    navbar: ~
    contents:
      - articles/browse

reference:
  - title: Palettes
    contents:
      - tf_palettes
      - tf_characters
      - tf_palette
      - tf_team_palette
      - tf_palette_names
      - tf_media
      - tf_show_palettes
      - tf_credit
  - title: Choosing colors for a plot
    contents:
      - tf_pick
      - tf_find_palettes
      - tf_palette_stats
  - title: ggplot2 scales
    contents:
      - scale_tf
  - title: Package
    contents:
      - transformerpalettes-package
